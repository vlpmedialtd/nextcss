<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kontakt</title>
<style>
body{font-family:Arial,Helvetica,sans-serif;margin:0;background:#f4f6f8;color:#1d2733}
.wrap{max-width:560px;margin:40px auto;background:#fff;padding:32px;border-radius:10px;box-shadow:0 2px 12px rgba(0,0,0,.08)}
h1{margin-top:0;display:flex;align-items:center;gap:10px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
label{display:block;font-weight:bold;font-size:14px;margin:16px 0 6px}
input[type=text],input[type=email],select,textarea{width:100%;padding:10px;border:1px solid #b8c2cc;border-radius:6px;font:inherit}
textarea{min-height:120px}
.check{display:flex;gap:8px;align-items:center;font-weight:normal}
.btn{background:#0a66c2;color:#fff;border:0;padding:12px 22px;border-radius:6px;font-weight:bold;cursor:pointer;margin-top:20px}
.btn:hover{background:#084f96}
.btn:focus-visible{outline:3px solid #ffbf47}
.hint{font-size:12px;color:#5b6773}
@media (max-width:480px){.row{grid-template-columns:1fr}.wrap{margin:0;border-radius:0}}
</style>
</head>
<body>
<div class="wrap">
<h1><svg width="28" height="28" viewBox="0 0 24 24" aria-hidden="true"><path fill="#0a66c2" d="M2 4h20v16H2z"/><path fill="#fff" d="M2 4l10 8 10-8"/></svg> Kontakt aufnehmen</h1>
<p>Wir melden uns <b>innerhalb von 24 Stunden</b>.</p>
<form action="/send" method="post" data-track="contact">
  <div class="row">
    <div><label for="vn">Vorname</label><input type="text" id="vn" name="vorname" required></div>
    <div><label for="nn">Nachname</label><input type="text" id="nn" name="nachname"></div>
  </div>
  <label for="em">E-Mail</label>
  <input type="email" id="em" name="email" placeholder="name@firma.de" required>
  <span class="hint">Wir geben Ihre Adresse nicht weiter.</span>
  <label for="th">Thema</label>
  <select id="th" name="thema"><option>Website</option><option selected>Shop</option><option>Sonstiges</option></select>
  <label for="msg">Nachricht</label>
  <textarea id="msg" name="nachricht">Hallo,
</textarea>
  <label class="check"><input type="checkbox" name="dsgvo" required> Ich akzeptiere die <a href="/datenschutz">Datenschutzerklärung</a>.</label>
  <button class="btn" type="submit" style="width:100%;font-size:16px">Absenden</button>
</form>
</div>
<script>document.querySelector('form').addEventListener('submit', function (e) { e.preventDefault(); });</script>
</body>
</html>
